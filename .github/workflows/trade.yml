name: jCoin 4h Trade

on:
  schedule:
    # Fires 5 min after each 4h bar close: 00:05, 04:05, 08:05, 12:05, 16:05, 20:05 UTC
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      reset_equity:
        description: "Reset paper equity to this amount (e.g. 10000). Leave blank to continue normally."
        required: false
        default: ""

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            kraken_state/
            paper_state/
          key: jcoin-state-${{ github.run_number }}
          restore-keys: jcoin-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Kraken demo trade
        env:
          KRAKEN_FUTURES_KEY: ${{ secrets.KRAKEN_FUTURES_KEY }}
          KRAKEN_FUTURES_SECRET: ${{ secrets.KRAKEN_FUTURES_SECRET }}
        run: python -m jcoin.live.run_kraken --state-dir kraken_state

      - name: Run paper simulation
        run: |
          RESET_ARG=""
          if [ -n "${{ github.event.inputs.reset_equity }}" ]; then
            RESET_ARG="--reset-equity ${{ github.event.inputs.reset_equity }}"
          fi
          python -m jcoin.live.run_paper --mode live --state-dir paper_state $RESET_ARG

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            kraken_state/
            paper_state/
          key: jcoin-state-${{ github.run_number }}
